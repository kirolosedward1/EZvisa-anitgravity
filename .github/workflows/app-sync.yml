# Keeps the website (main) and the EZvisa app (mobile/ on the mobile-app branch) on one contract.
# Fails when lib/shared/wizard-contract.ts and mobile/lib/* disagree (lists, options, steps, validation, statuses,
# document types, price, deep-link scheme), typechecks the website, and runs `pnpm test`. See docs/APP_WEB_SYNC.md.
name: Website ↔ App sync

on:
  push:
    branches: [main, mobile-app]
  pull_request:
    branches: [main, mobile-app]

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch both sides of the contract
        run: |
          git fetch origin main:refs/remotes/origin/main || true
          git fetch origin mobile-app:refs/remotes/origin/mobile-app || true

      - name: Compare the website contract with the app
        # main contains an old mobile/ tree, so file presence cannot tell the two sides apart.
        # A mobile-app push, or a PR into mobile-app, reads ./mobile and the contract from main.
        # A website push or PR reads the live app from origin/mobile-app and the contract in this checkout.
        run: |
          if [ "${{ github.base_ref }}" = "mobile-app" ] || [ "${{ github.ref }}" = "refs/heads/mobile-app" ]; then
            node scripts/check-app-sync.mts --mobile mobile --contract-ref origin/main
          else
            node scripts/check-app-sync.mts --ref origin/mobile-app
          fi

      - name: Typecheck the website
        if: ${{ !startsWith(github.ref, 'refs/heads/mobile-app') && github.base_ref != 'mobile-app' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

  unit-tests:
    if: ${{ !startsWith(github.ref, 'refs/heads/mobile-app') && github.base_ref != 'mobile-app' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install and run unit tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test
